<!DOCTYPE html>
<html>
<head>
    <title>Truely Wireless Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            text-align: center;
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
            background-color: #111;
            color: white;
        }

        .navbar {
            display: flex;
            justify-content: center;
            background-color: #e60000;
            padding: 10px;
            gap: 20px;
        }

        .navbar a, .navbar button {
            color: white;
            text-decoration: none;
            font-weight: bold;
            background: none;
            border: none;
            cursor: pointer;
        }

        .navbar a:hover, .navbar button:hover {
            text-decoration: underline;
        }

        .container {
            padding: 30px;
            max-width: 800px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        }

        .hidden {
            display: none !important;
        }

        .checkbox-list {
            max-height: 250px;
            overflow-y: auto;
            margin-top: 10px;
        }

        button.run-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #e60000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button.run-btn:disabled {
            background-color: gray;
            cursor: not-allowed;
        }

        /* Loader */
        .loader-box {
            margin-top: 20px;
            padding: 15px;
            background: #f1f1f1;
            border-radius: 5px;
        }

        .status-item {
            margin-bottom: 5px;
        }
        /* Overlay */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(5px);
    background: rgba(0,0,0,0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
}

/* Loader box */
.loader-popup {
    background: white;
    padding: 25px;
    border-radius: 10px;
    width: 350px;
    text-align: center;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
}

.loader-popup h3 {
    margin-bottom: 15px;
}
    </style>
</head>

<body>

<div class="header">
    PRUELY WIRELESS
</div>

<div class="navbar">
    <a href="https://www.t-mobiledealerordering.com/" target="_blank">Visit Website</a>
    <a href="https://www.myrtpos.com/" target="_blank">Visit RTBDI</a>

    <button onclick="showSection('amounts')">Get Amounts</button>
    <button onclick="showSection('allocation')">Get Allocation</button>
    <button onclick="showSection('details')">Market Details</button>
</div>

<div class="container">

    <!-- Amounts -->
    <div id="amounts" class="card hidden">
        <h3>Select Markets - Capacity</h3>

        <form method="POST" action="/run/amounts" onsubmit="startLoader('amounts')">

            <label>
                <input type="checkbox" onclick="selectAll(this, 'amounts-list')">
                Select All
            </label>

            <div id="amounts-list" class="checkbox-list"></div>

            <button id="amountsBtn" class="run-btn" type="submit">Run Capacity</button>
        </form>

        <!-- Loader -->
        <div id="loader-amounts" class="loader-box hidden">
            <h4>Processing...</h4>
            <div id="status-amounts"></div>
        </div>
    </div>

    <!-- Allocation -->
    <div id="allocation" class="card hidden">
        <h3>Select Markets - Allocation</h3>

        <form method="POST" action="/run/allocation" onsubmit="startLoader('allocation')">

            <label>
                <input type="checkbox" onclick="selectAll(this, 'allocation-list')">
                Select All
            </label>

            <div id="allocation-list" class="checkbox-list"></div>

            <button id="allocationBtn" class="run-btn" type="submit">Run Allocation</button>
        </form>

        <!-- Loader -->
        <div id="loader-allocation" class="loader-box hidden">
            <h4>Processing...</h4>
            <div id="status-allocation"></div>
        </div>
    </div>

    <!-- Market Details -->
    <div id="details" class="card hidden">
        <h3>Market Details</h3>
        <p>Coming soon...</p>
    </div>

</div>

<script>
function showSection(sectionId) {
    document.querySelectorAll('.card').forEach(el => el.classList.add('hidden'));
    document.getElementById(sectionId).classList.remove('hidden');
}

// Fetch markets
fetch("/markets")
.then(res => res.json())
.then(data => {
    let amountsDiv = document.getElementById("amounts-list");
    let allocationDiv = document.getElementById("allocation-list");

    data.markets.forEach(market => {
        let html = `<label><input type="checkbox" name="markets" value="${market}"> ${market}</label><br>`;
        amountsDiv.innerHTML += html;
        allocationDiv.innerHTML += html;
    });
});

// Select all
function selectAll(source, containerId) {
    let checkboxes = document.getElementById(containerId).querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(cb => cb.checked = source.checked);
}

// Loader
function startLoader(type) {

    let selected = document.querySelectorAll(`#${type}-list input:checked`);
    let overlay = document.getElementById("overlay");
    let statusBox = document.getElementById("status-box");
    let btn = document.getElementById(`${type}Btn`);

    // 🔥 FORCE SHOW
    overlay.style.display = "flex";

    statusBox.innerHTML = "";
    btn.disabled = true;

    if (selected.length === 0) {
        statusBox.innerHTML = "⏳ Running for ALL markets...";
    } else {
        selected.forEach(cb => {
            let div = document.createElement("div");
            div.innerHTML = `⏳ ${cb.value} → Processing...`;
            statusBox.appendChild(div);
        });
    }
}
</script>

</body>
<div id="overlay" class="overlay hidden" style="display: none">
    <div class="loader-popup">
        <h3>Processing...</h3>
        <div id="status-box"></div>
    </div>
</div>
</html>
